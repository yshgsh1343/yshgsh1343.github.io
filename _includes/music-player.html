<div id="music-player" class="music-player music-player--collapsed" data-src="{{ '/assets/data/music.json' | relative_url }}">
  <button type="button" id="mp-cover-btn" class="music-player__cover" aria-label="展开/收起播放器" title="展开/收起播放器">
    <i class="fas fa-music"></i>
    <!-- src 必须存在且非空：空串会被主题拼成死链 /src（htmlproofer 报错），
         缺失则 refactor-content 处理 img 时把后续正文全部吞掉。
         用 1x1 透明 gif 占位，真实封面由 JS 播放时赋值。 -->
    <img id="mp-cover-img" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" hidden>
  </button>
  <div class="music-player__body">
    <div class="music-player__title" id="mp-title">歌单加载中……</div>
    <div class="music-player__artist" id="mp-artist"></div>
    <div class="music-player__progress" id="mp-progress" title="点击跳转">
      <div class="music-player__bar" id="mp-bar"></div>
    </div>
    <div class="music-player__meta">
      <span id="mp-time">0:00 / 0:00</span>
      <span id="mp-mode">列表循环</span>
    </div>
    <div class="music-player__status" id="mp-status" hidden></div>
  </div>
  <div class="music-player__controls">
    <button type="button" id="mp-mode-btn" class="music-player__btn" aria-label="切换播放模式" title="列表循环"><i class="fas fa-retweet" id="mp-mode-icon"></i></button>
    <button type="button" id="mp-prev" class="music-player__btn" aria-label="上一首" title="上一首"><i class="fas fa-step-backward"></i></button>
    <button type="button" id="mp-toggle" class="music-player__btn music-player__btn--main" aria-label="播放" title="播放"><i class="fas fa-play" id="mp-toggle-icon"></i></button>
    <button type="button" id="mp-next" class="music-player__btn" aria-label="下一首" title="下一首"><i class="fas fa-step-forward"></i></button>
  </div>
</div>

<style>
  .music-player {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.1rem;
    border: 1px solid var(--main-border-color, #e5e7eb);
    border-radius: 0.9rem;
    background: var(--card-bg, rgba(255, 255, 255, 0.02));
  }

  .music-player--docked {
    margin-top: 2.5rem;
  }

  /* 非关于页：固定在右下角的悬浮形态 */
  .music-player--float {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 1030;
    width: min(21rem, calc(100vw - 2rem));
    margin: 0;
    padding: 0.7rem 0.85rem;
    background: var(--main-bg, #fff);
    box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.18);
  }

  /* 收起时贴住屏幕右缘，只露出封面按钮的半胶囊 */
  .music-player--float.music-player--collapsed {
    right: 0;
    width: auto;
    gap: 0;
    padding: 0.25rem 0.1rem 0.25rem 0.3rem;
    border-radius: 999px 0 0 999px;
    border-right: 0;
  }

  .music-player--float.music-player--collapsed .music-player__body,
  .music-player--float.music-player--collapsed .music-player__controls {
    display: none;
  }

  /* 悬浮播放器占了右下角，把返回顶部按钮抬高让位 */
  body:has(#music-player.music-player--float) #back-to-top {
    bottom: 5.75rem;
  }

  .music-player__cover {
    position: relative;
    flex: none;
    width: 3.6rem;
    height: 3.6rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--main-border-color, #e5e7eb);
    color: var(--text-muted-color, #6b7280);
    cursor: default;
    animation: mp-spin 24s linear infinite;
    animation-play-state: paused;
  }

  .music-player--float .music-player__cover {
    cursor: pointer;
    width: 3.2rem;
    height: 3.2rem;
  }

  .music-player--playing .music-player__cover {
    animation-play-state: running;
  }

  .music-player__cover img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .music-player__body {
    flex: 1;
    min-width: 0;
  }

  .music-player__title {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .music-player__artist {
    color: var(--text-muted-color, #6b7280);
    font-size: 0.85rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 1.2em;
  }

  .music-player--float .music-player__artist {
    display: none;
  }

  .music-player__progress {
    height: 0.35rem;
    margin: 0.55rem 0 0.35rem;
    border-radius: 999px;
    background: var(--main-border-color, #e5e7eb);
    cursor: pointer;
    touch-action: none;
  }

  .music-player__bar {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--link-color, #2563eb);
  }

  .music-player__meta {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--text-muted-color, #6b7280);
    font-variant-numeric: tabular-nums;
  }

  .music-player__status {
    margin-top: 0.35rem;
    font-size: 0.78rem;
    color: var(--text-muted-color, #6b7280);
  }

  .music-player__controls {
    display: flex;
    align-items: center;
    gap: 0.15rem;
    flex: none;
  }

  .music-player__btn {
    width: 2.1rem;
    height: 2.1rem;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text-color, #374151);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .music-player__btn:hover {
    background: rgba(128, 128, 128, 0.15);
  }

  .music-player__btn:disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }

  .music-player__btn--main {
    width: 2.5rem;
    height: 2.5rem;
    color: #fff;
    background: var(--link-color, #2563eb);
  }

  .music-player__btn--main:hover {
    background: var(--link-color, #2563eb);
    opacity: 0.9;
  }

  .music-player__btn--main .fa-play {
    margin-left: 0.12em;
  }

  @keyframes mp-spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .music-player__cover {
      animation: none;
    }
  }

  @media (max-width: 576px) {
    .music-player--docked {
      gap: 0.75rem;
      padding: 0.85rem 0.9rem;
    }

    .music-player--float {
      gap: 0.6rem;
    }

    .music-player__btn {
      width: 1.9rem;
      height: 1.9rem;
    }

    .music-player__btn--main {
      width: 2.3rem;
      height: 2.3rem;
    }
  }
</style>

<script>
  (() => {
    const root = document.getElementById('music-player');
    if (!root) return;

    /* 关于页放一个 #music-player-dock 占位，播放器就内嵌到那里；
       其他页面悬浮在右下角，默认收起贴右缘。
       游客本次会话里从未在关于页点过播放（mp-active-v1 未置位）时，
       非关于页直接移除播放器，不渲染也不请求歌单。
       注意：这个内联脚本会被 compress_html 压成一行，只能用块注释，
       且每条语句必须带分号。 */
    const AKEY = 'mp-active-v1';
    const dock = document.getElementById('music-player-dock');
    let activated = false;
    try { activated = sessionStorage.getItem(AKEY) === '1'; } catch (_) {}
    if (dock) {
      dock.appendChild(root);
      root.classList.add('music-player--docked');
      root.classList.remove('music-player--collapsed');
    } else if (!activated) {
      root.remove();
      return;
    } else {
      root.classList.add('music-player--float');
    }

    const els = {
      coverBtn: document.getElementById('mp-cover-btn'),
      cover: document.getElementById('mp-cover-img'),
      title: document.getElementById('mp-title'),
      artist: document.getElementById('mp-artist'),
      progress: document.getElementById('mp-progress'),
      bar: document.getElementById('mp-bar'),
      time: document.getElementById('mp-time'),
      mode: document.getElementById('mp-mode'),
      status: document.getElementById('mp-status'),
      modeBtn: document.getElementById('mp-mode-btn'),
      modeIcon: document.getElementById('mp-mode-icon'),
      prev: document.getElementById('mp-prev'),
      toggle: document.getElementById('mp-toggle'),
      toggleIcon: document.getElementById('mp-toggle-icon'),
      next: document.getElementById('mp-next')
    };

    const audio = new Audio();
    audio.preload = 'none';
    audio.volume = 0.8;

    /* 播放进度存 sessionStorage：翻页续播，关标签页自动清零。
       播放模式存 localStorage：是长期偏好。 */
    const SKEY = 'mp-session-v1';
    const MKEY = 'mp-mode';
    const MODES = ['list', 'shuffle', 'one'];
    const MODE_META = {
      list: { icon: 'fas fa-retweet', label: '列表循环' },
      shuffle: { icon: 'fas fa-random', label: '随机播放' },
      one: { icon: 'fas fa-redo', label: '单曲循环' }
    };

    let mode = localStorage.getItem(MKEY);
    if (MODES.indexOf(mode) === -1) mode = 'list';

    let tracks = [];
    let order = [];
    let pos = 0;
    let errorStreak = 0;
    let seeking = false;
    let started = false;
    let wantPlaying = false;
    let pendingSeek = 0;
    let knownDur = 0;
    let lastSave = 0;
    let resumeArmed = false;

    const setStatus = (message) => {
      els.status.textContent = message || '';
      els.status.hidden = !message;
    };

    const formatTime = (seconds) => {
      if (!Number.isFinite(seconds)) return '0:00';
      const s = Math.max(0, Math.round(seconds));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    };

    const shuffle = (list) => {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    };

    /* 按当前模式重排播放顺序；startIdx >= 0 时保证该曲目是当前位置 */
    const buildOrder = (startIdx) => {
      order = tracks.map((_, i) => i);
      pos = 0;
      if (mode === 'shuffle') {
        shuffle(order);
        if (startIdx >= 0) {
          const k = order.indexOf(startIdx);
          if (k > 0) {
            const t = order[0];
            order[0] = order[k];
            order[k] = t;
          }
        }
      } else if (startIdx >= 0) {
        pos = startIdx;
      }
    };

    /* 随机模式播完一轮：重新洗牌，避免新一轮开头重复上一首 */
    const wrapShuffle = () => {
      const last = order[order.length - 1];
      order = shuffle(tracks.map((_, i) => i));
      if (order.length > 1 && order[0] === last) {
        const j = 1 + Math.floor(Math.random() * (order.length - 1));
        const t = order[0];
        order[0] = order[j];
        order[j] = t;
      }
      pos = 0;
    };

    const current = () => tracks[order[pos]];

    const saveState = () => {
      if (!started) return;
      try {
        sessionStorage.setItem(SKEY, JSON.stringify({
          idx: order[pos],
          order: order,
          pos: pos,
          time: audio.currentTime > 0 ? audio.currentTime : pendingSeek,
          dur: Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : knownDur,
          playing: wantPlaying,
          /* 只有悬浮形态的展开状态才值得记住；关于页内嵌形态永远展开，
             不能把它当成"用户想展开悬浮球" */
          open: !dock && !root.classList.contains('music-player--collapsed')
        }));
      } catch (_) {}
    };

    const readState = () => {
      try {
        return JSON.parse(sessionStorage.getItem(SKEY));
      } catch (_) {
        return null;
      }
    };

    const applyModeUI = () => {
      const meta = MODE_META[mode];
      els.modeIcon.className = meta.icon;
      els.modeBtn.title = meta.label;
      els.modeBtn.setAttribute('aria-label', meta.label);
      els.mode.textContent = tracks.length ? `${meta.label} · ${tracks.length} 首` : meta.label;
    };

    const updateMediaSession = (track) => {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.name || '',
        artist: track.artist || '',
        artwork: track.pic ? [{ src: track.pic }] : []
      });
    };

    const load = (track) => {
      els.title.textContent = track.name || '未知曲目';
      els.artist.textContent = track.artist || '';
      els.bar.style.width = '0%';
      els.time.textContent = '0:00 / 0:00';
      els.cover.hidden = true;
      if (track.pic) els.cover.src = track.pic;
      pendingSeek = 0;
      knownDur = 0;
      audio.src = track.url;
      updateMediaSession(track);
    };

    els.cover.addEventListener('load', () => { els.cover.hidden = false; });
    els.cover.addEventListener('error', () => { els.cover.hidden = true; });

    /* 自动播放被浏览器拦截时，等用户在页面上任意一次交互后立刻续播 */
    const armResume = () => {
      if (resumeArmed) return;
      resumeArmed = true;
      const kick = () => {
        document.removeEventListener('pointerdown', kick);
        document.removeEventListener('keydown', kick);
        resumeArmed = false;
        if (started && wantPlaying && audio.paused) {
          audio.play().catch(() => {});
        }
      };
      document.addEventListener('pointerdown', kick);
      document.addEventListener('keydown', kick);
    };

    const play = () => {
      audio.play().catch(() => { armResume(); });
    };

    const step = (delta, autoplayNext) => {
      if (!tracks.length) return;
      if (delta > 0) {
        pos += 1;
        if (pos >= order.length) {
          if (mode === 'shuffle') {
            wrapShuffle();
          } else {
            pos = 0;
          }
        }
      } else {
        pos = (pos - 1 + order.length) % order.length;
      }
      load(current());
      if (autoplayNext) play();
      saveState();
    };

    els.toggle.addEventListener('click', () => {
      if (!started) return;
      if (audio.paused) {
        wantPlaying = true;
        play();
      } else {
        wantPlaying = false;
        audio.pause();
      }
      saveState();
    });
    els.next.addEventListener('click', () => { if (started) step(1, wantPlaying); });
    els.prev.addEventListener('click', () => { if (started) step(-1, wantPlaying); });

    els.modeBtn.addEventListener('click', () => {
      if (!started) return;
      mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
      try { localStorage.setItem(MKEY, mode); } catch (_) {}
      buildOrder(order[pos]);
      applyModeUI();
      saveState();
    });

    if (!dock) {
      els.coverBtn.addEventListener('click', () => {
        root.classList.toggle('music-player--collapsed');
        saveState();
      });
    }

    audio.addEventListener('playing', () => {
      /* 真正播过一次才算激活，之后其他页面才出现悬浮播放器（本会话内） */
      try { sessionStorage.setItem(AKEY, '1'); } catch (_) {}
      errorStreak = 0;
      wantPlaying = true;
      root.classList.add('music-player--playing');
      els.toggleIcon.className = 'fas fa-pause';
      els.toggle.setAttribute('aria-label', '暂停');
      setStatus('');
      saveState();
    });

    audio.addEventListener('pause', () => {
      root.classList.remove('music-player--playing');
      els.toggleIcon.className = 'fas fa-play';
      els.toggle.setAttribute('aria-label', '播放');
    });

    /* 播完永不停：单曲循环回到 0，其余模式接着播下一首 */
    audio.addEventListener('ended', () => {
      if (mode === 'one') {
        audio.currentTime = 0;
        play();
      } else {
        step(1, true);
      }
    });

    audio.addEventListener('error', () => {
      if (!started) return;
      errorStreak += 1;
      if (errorStreak >= tracks.length) {
        setStatus('歌单里的歌曲暂时都无法播放，稍后再试试。');
        root.classList.remove('music-player--playing');
        els.toggleIcon.className = 'fas fa-play';
        return;
      }
      setStatus(`「${current().name}」无法播放，已跳过`);
      setTimeout(() => step(1, true), 500);
    });

    const renderProgress = () => {
      const ratio = Number.isFinite(audio.duration) && audio.duration > 0
        ? audio.currentTime / audio.duration
        : 0;
      els.bar.style.width = `${(ratio * 100).toFixed(2)}%`;
      els.time.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    };

    audio.addEventListener('timeupdate', () => {
      if (!seeking) renderProgress();
      const now = Date.now();
      if (now - lastSave > 1000) {
        lastSave = now;
        saveState();
      }
    });
    audio.addEventListener('durationchange', renderProgress);

    audio.addEventListener('loadedmetadata', () => {
      knownDur = audio.duration;
      if (pendingSeek > 0 && pendingSeek < audio.duration - 1) {
        audio.currentTime = pendingSeek;
      }
      pendingSeek = 0;
    });

    window.addEventListener('pagehide', saveState);

    const seekRatio = (event) => {
      const rect = els.progress.getBoundingClientRect();
      return Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
    };

    els.progress.addEventListener('pointerdown', (event) => {
      if (!started || !Number.isFinite(audio.duration) || audio.duration <= 0) return;
      seeking = true;
      try { els.progress.setPointerCapture(event.pointerId); } catch (_) {}
      els.bar.style.width = `${seekRatio(event) * 100}%`;
    });
    els.progress.addEventListener('pointermove', (event) => {
      if (seeking) els.bar.style.width = `${seekRatio(event) * 100}%`;
    });
    els.progress.addEventListener('pointerup', (event) => {
      if (!seeking) return;
      seeking = false;
      audio.currentTime = seekRatio(event) * audio.duration;
      saveState();
    });
    els.progress.addEventListener('pointercancel', () => { seeking = false; });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => {
        if (started) {
          wantPlaying = true;
          play();
        }
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        wantPlaying = false;
        audio.pause();
        saveState();
      });
      navigator.mediaSession.setActionHandler('previoustrack', () => { if (started) step(-1, true); });
      navigator.mediaSession.setActionHandler('nexttrack', () => { if (started) step(1, true); });
    }

    const disableButtons = (disabled) => {
      [els.modeBtn, els.prev, els.toggle, els.next].forEach((button) => { button.disabled = disabled; });
    };

    disableButtons(true);
    applyModeUI();

    fetch(root.dataset.src)
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((data) => {
        if (!Array.isArray(data)) throw new Error('歌单数据格式不对');
        tracks = data.filter((item) => item && item.url);
        if (!tracks.length) throw new Error('歌单是空的');
        disableButtons(false);

        /* 有上一页留下的进度就无缝续播，否则按当前模式备好第一首（暂停态） */
        const st = readState();
        let restored = false;
        if (st && Number.isInteger(st.idx) && st.idx >= 0 && st.idx < tracks.length) {
          if (Array.isArray(st.order) && st.order.length === tracks.length && st.order[st.pos] === st.idx) {
            order = st.order;
            pos = st.pos;
          } else {
            buildOrder(st.idx);
          }
          started = true;
          load(current());
          knownDur = st.dur > 0 ? st.dur : 0;
          if (st.time > 0) {
            pendingSeek = st.time;
            els.time.textContent = `${formatTime(st.time)} / ${formatTime(knownDur > 0 ? knownDur : NaN)}`;
            if (knownDur > 0) {
              els.bar.style.width = `${((st.time / knownDur) * 100).toFixed(2)}%`;
            }
          }
          if (!dock && st.open) root.classList.remove('music-player--collapsed');
          if (st.playing) {
            wantPlaying = true;
            play();
          }
          restored = true;
        }
        if (!restored) {
          buildOrder(mode === 'shuffle' ? -1 : 0);
          started = true;
          load(current());
        }
        applyModeUI();
        saveState();
      })
      .catch((error) => {
        els.title.textContent = '歌单加载失败';
        setStatus(`${error.message || error}（刷新再试）`);
      });
  })();
</script>
